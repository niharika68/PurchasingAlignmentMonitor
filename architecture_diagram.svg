<svg viewBox="0 0 1400 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 32px; font-weight: bold; fill: #0f172a; }
      .section-label { font-size: 16px; font-weight: 700; fill: #1e40af; letter-spacing: 1.2px; }
      .box-title { font-size: 15px; font-weight: 600; fill: #ffffff; }
      .box-desc { font-size: 11px; fill: #ffffff; opacity: 0.95; }
      .label-text { font-size: 12px; fill: #334155; font-weight: 500; }
      .small-text { font-size: 10px; fill: #64748b; }
      
      .aws-box { fill: #FF9900; }
      .storage-box { fill: #569A31; }
      .process-box { fill: #7C3AED; }
      .output-box { fill: #059669; }
      .data-box { fill: #DC2626; }
      .ai-box { fill: #2563EB; }
      
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-gray); }
      .arrow-main { stroke: #3b82f6; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-data { stroke: #ef4444; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
    </style>
    
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ef4444" />
    </marker>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1800" fill="#f1f5f9"/>

  <!-- Title -->
  <text x="700" y="45" class="title" text-anchor="middle">Purchasing Alignment Monitor - Complete Architecture</text>
  <text x="700" y="70" class="label-text" text-anchor="middle">AWS Bedrock RAG &amp; LangGraph Workflow with AI Insights</text>

  <!-- ============ LAYER 1: AWS INFRASTRUCTURE ============ -->
  <text x="50" y="120" class="section-label">LAYER 1: AWS INFRASTRUCTURE AND RAG</text>

  <rect x="80" y="150" width="240" height="140" rx="10" class="storage-box" filter="url(#shadow)"/>
  <text x="200" y="180" class="box-title" text-anchor="middle" style="font-size: 14px;">Amazon S3</text>
  <text x="200" y="205" class="box-desc" text-anchor="middle" style="font-size: 10px;">Vector Database</text>
  <rect x="100" y="225" width="200" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="200" y="240" class="box-desc" text-anchor="middle" style="font-size: 9px;">Embeddings &amp; Documents</text>
  <text x="200" y="255" class="box-desc" text-anchor="middle" style="font-size: 9px;">Indexed for fast retrieval</text>

  <rect x="400" y="150" width="240" height="140" rx="10" class="aws-box" filter="url(#shadow)"/>
  <text x="520" y="180" class="box-title" text-anchor="middle" style="font-size: 14px;">Bedrock KB</text>
  <text x="520" y="205" class="box-desc" text-anchor="middle" style="font-size: 10px;">Knowledge Base</text>
  <rect x="420" y="225" width="200" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="520" y="240" class="box-desc" text-anchor="middle" style="font-size: 9px;">RAG Orchestration</text>
  <text x="520" y="255" class="box-desc" text-anchor="middle" style="font-size: 9px;">retrieve + retrieve_and_generate</text>

  <rect x="720" y="150" width="240" height="140" rx="10" class="aws-box" filter="url(#shadow)"/>
  <text x="840" y="180" class="box-title" text-anchor="middle" style="font-size: 14px;">Bedrock LLM</text>
  <text x="840" y="205" class="box-desc" text-anchor="middle" style="font-size: 10px;">Amazon Nova Pro</text>
  <rect x="740" y="225" width="200" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="840" y="240" class="box-desc" text-anchor="middle" style="font-size: 9px;">AI Insights Generation</text>
  <text x="840" y="255" class="box-desc" text-anchor="middle" style="font-size: 9px;">Executive Summaries</text>

  <rect x="1040" y="150" width="240" height="140" rx="10" class="aws-box" filter="url(#shadow)"/>
  <text x="1160" y="180" class="box-title" text-anchor="middle" style="font-size: 14px;">Agent Runtime</text>
  <text x="1160" y="205" class="box-desc" text-anchor="middle" style="font-size: 10px;">Bedrock Agent Runtime</text>
  <rect x="1060" y="225" width="200" height="50" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="1160" y="240" class="box-desc" text-anchor="middle" style="font-size: 9px;">Orchestrates KB + LLM</text>
  <text x="1160" y="255" class="box-desc" text-anchor="middle" style="font-size: 9px;">API calls</text>

  <!-- Arrows between AWS components -->
  <path d="M 320 220 L 400 220" class="arrow"/>
  <path d="M 640 220 L 720 220" class="arrow"/>
  <path d="M 960 220 L 1040 220" class="arrow"/>

  <!-- ============ LAYER 2: KNOWLEDGE BASE CONTENT ============ -->
  <text x="50" y="350" class="section-label">LAYER 2: RAG KNOWLEDGE BASE CONTENT</text>

  <rect x="80" y="380" width="280" height="140" rx="10" class="data-box" filter="url(#shadow)"/>
  <text x="220" y="410" class="box-title" text-anchor="middle" style="font-size: 14px;">Contract Rules</text>
  <rect x="100" y="430" width="240" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="220" y="445" class="box-desc" text-anchor="middle" style="font-size: 10px;">Pricing Tier Thresholds</text>
  <text x="220" y="462" class="box-desc" text-anchor="middle" style="font-size: 10px;">$800K-$900K-$1M Tiers</text>
  <text x="220" y="479" class="box-desc" text-anchor="middle" style="font-size: 10px;">Discount Percentages</text>
  <text x="220" y="496" class="box-desc" text-anchor="middle" style="font-size: 10px;">Compliance Requirements</text>

  <rect x="420" y="380" width="280" height="140" rx="10" class="data-box" filter="url(#shadow)"/>
  <text x="560" y="410" class="box-title" text-anchor="middle" style="font-size: 14px;">Product Catalog</text>
  <rect x="440" y="430" width="240" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="560" y="445" class="box-desc" text-anchor="middle" style="font-size: 10px;">Branded Rx Products (10)</text>
  <text x="560" y="462" class="box-desc" text-anchor="middle" style="font-size: 10px;">Generic Products (9)</text>
  <text x="560" y="479" class="box-desc" text-anchor="middle" style="font-size: 10px;">OneStop Products (1)</text>
  <text x="560" y="496" class="box-desc" text-anchor="middle" style="font-size: 10px;">NDC, WAC, Contract Prices</text>

  <rect x="760" y="380" width="280" height="140" rx="10" class="data-box" filter="url(#shadow)"/>
  <text x="900" y="410" class="box-title" text-anchor="middle" style="font-size: 14px;">Purchase Orders</text>
  <rect x="780" y="430" width="240" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="900" y="445" class="box-desc" text-anchor="middle" style="font-size: 10px;">Hospital IDs and Names</text>
  <text x="900" y="462" class="box-desc" text-anchor="middle" style="font-size: 10px;">Drug NDCs and Quantities</text>
  <text x="900" y="479" class="box-desc" text-anchor="middle" style="font-size: 10px;">Unit Prices and Totals</text>
  <text x="900" y="496" class="box-desc" text-anchor="middle" style="font-size: 10px;">Contract Tiers Applied</text>

  <!-- All stored in S3/KB -->
  <text x="560" y="560" class="small-text" text-anchor="middle">All documents indexed in S3 with vector embeddings for semantic search</text>
  <path d="M 220 380 L 200 290" class="arrow-data" stroke-width="2"/>
  <path d="M 560 380 L 520 290" class="arrow-data" stroke-width="2"/>
  <path d="M 900 380 L 520 290" class="arrow-data" stroke-width="2"/>

  <!-- ============ LAYER 3: LANGGRAPH WORKFLOW ============ -->
  <text x="50" y="620" class="section-label">LAYER 3: LANGGRAPH WORKFLOW (5 Agent Steps)</text>

  <!-- Step 1: Retrieve Contract Rules -->
  <rect x="80" y="660" width="220" height="100" rx="10" class="process-box" filter="url(#shadow)"/>
  <text x="190" y="685" class="box-title" text-anchor="middle" style="font-size: 12px;">Step 1: Contract Rules</text>
  <rect x="95" y="700" width="190" height="45" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="190" y="715" class="box-desc" text-anchor="middle" style="font-size: 9px;">retrieve_and_generate</text>
  <text x="190" y="730" class="box-desc" text-anchor="middle" style="font-size: 9px;">Parse tier thresholds</text>

  <!-- Step 2: Retrieve Product Catalog -->
  <rect x="330" y="660" width="220" height="100" rx="10" class="process-box" filter="url(#shadow)"/>
  <text x="440" y="685" class="box-title" text-anchor="middle" style="font-size: 12px;">Step 2: Product Catalog</text>
  <rect x="345" y="700" width="190" height="45" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="440" y="715" class="box-desc" text-anchor="middle" style="font-size: 9px;">retrieve_and_generate</text>
  <text x="440" y="730" class="box-desc" text-anchor="middle" style="font-size: 9px;">Branded/Generic/OneStop</text>

  <!-- Step 3: Retrieve PO Data -->
  <rect x="580" y="660" width="220" height="100" rx="10" class="process-box" filter="url(#shadow)"/>
  <text x="690" y="685" class="box-title" text-anchor="middle" style="font-size: 12px;">Step 3: PO Data</text>
  <rect x="595" y="700" width="190" height="45" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="690" y="715" class="box-desc" text-anchor="middle" style="font-size: 9px;">retrieve (raw chunks)</text>
  <text x="690" y="730" class="box-desc" text-anchor="middle" style="font-size: 9px;">Reconstruct CSV</text>

  <!-- Step 4: Analyze Alignment -->
  <rect x="830" y="660" width="220" height="100" rx="10" class="process-box" filter="url(#shadow)"/>
  <text x="940" y="685" class="box-title" text-anchor="middle" style="font-size: 12px;">Step 4: Analyze</text>
  <rect x="845" y="700" width="190" height="45" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="940" y="715" class="box-desc" text-anchor="middle" style="font-size: 9px;">Detect violations</text>
  <text x="940" y="730" class="box-desc" text-anchor="middle" style="font-size: 9px;">Assign risk levels</text>

  <!-- Step 5: AI Insights -->
  <rect x="1080" y="660" width="220" height="100" rx="10" class="ai-box" filter="url(#shadow)"/>
  <text x="1190" y="685" class="box-title" text-anchor="middle" style="font-size: 12px;">Step 5: AI Insights</text>
  <rect x="1095" y="700" width="190" height="45" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="1190" y="715" class="box-desc" text-anchor="middle" style="font-size: 9px;">Amazon Nova Pro</text>
  <text x="1190" y="730" class="box-desc" text-anchor="middle" style="font-size: 9px;">Recommendations</text>

  <!-- Workflow arrows -->
  <path d="M 300 710 L 330 710" class="arrow-main"/>
  <path d="M 550 710 L 580 710" class="arrow-main"/>
  <path d="M 800 710 L 830 710" class="arrow-main"/>
  <path d="M 1050 710 L 1080 710" class="arrow-main"/>

  <!-- ============ LAYER 4: RISK DETECTION & CLASSIFICATION ============ -->
  <text x="50" y="820" class="section-label">LAYER 4: RISK DETECTION &amp; CLASSIFICATION</text>

  <!-- Risk Detection Grid -->
  <rect x="80" y="860" width="1220" height="130" rx="10" class="process-box" filter="url(#shadow)"/>
  <text x="700" y="885" class="box-title" text-anchor="middle" style="font-size: 14px;">Misalignment Detection Engine</text>

  <rect x="100" y="910" width="280" height="65" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="240" y="928" class="box-desc" text-anchor="middle" style="font-size: 11px; font-weight: 600;">Off-Contract Drugs</text>
  <text x="240" y="945" class="box-desc" text-anchor="middle" style="font-size: 9px;">NDC not in product catalog</text>
  <text x="240" y="960" class="box-desc" text-anchor="middle" style="font-size: 9px;">Risk: HIGH</text>

  <rect x="420" y="910" width="280" height="65" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="560" y="928" class="box-desc" text-anchor="middle" style="font-size: 11px; font-weight: 600;">Below Tier Minimum</text>
  <text x="560" y="945" class="box-desc" text-anchor="middle" style="font-size: 9px;">Annual spend &lt; $800K</text>
  <text x="560" y="960" class="box-desc" text-anchor="middle" style="font-size: 9px;">Risk: MEDIUM</text>

  <rect x="740" y="910" width="280" height="65" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="880" y="928" class="box-desc" text-anchor="middle" style="font-size: 11px; font-weight: 600;">Price Deviation</text>
  <text x="880" y="945" class="box-desc" text-anchor="middle" style="font-size: 9px;">Over contract pricing &gt;10%</text>
  <text x="880" y="960" class="box-desc" text-anchor="middle" style="font-size: 9px;">Risk: MEDIUM</text>

  <rect x="1060" y="910" width="220" height="65" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="1170" y="928" class="box-desc" text-anchor="middle" style="font-size: 11px; font-weight: 600;">Tier Mismatch</text>
  <text x="1170" y="945" class="box-desc" text-anchor="middle" style="font-size: 9px;">Wrong tier applied</text>
  <text x="1170" y="960" class="box-desc" text-anchor="middle" style="font-size: 9px;">Risk: MEDIUM</text>

  <!-- Arrow from workflow to risk -->
  <path d="M 700 760 L 700 860" class="arrow-main"/>

  <!-- ============ LAYER 5: AI INSIGHTS ============ -->
  <text x="50" y="1050" class="section-label">LAYER 5: AI-POWERED INSIGHTS (Amazon Nova Pro)</text>

  <rect x="80" y="1090" width="400" height="140" rx="10" class="ai-box" filter="url(#shadow)"/>
  <text x="280" y="1120" class="box-title" text-anchor="middle" style="font-size: 14px;">Per-Hospital Analysis</text>
  <rect x="100" y="1140" width="360" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="280" y="1160" class="box-desc" text-anchor="middle" style="font-size: 10px;">Misalignment explanation (2-3 sentences)</text>
  <text x="280" y="1180" class="box-desc" text-anchor="middle" style="font-size: 10px;">Actionable recommendations (3-5 bullets)</text>
  <text x="280" y="1200" class="box-desc" text-anchor="middle" style="font-size: 10px;">Estimated savings/benefits</text>

  <rect x="540" y="1090" width="400" height="140" rx="10" class="ai-box" filter="url(#shadow)"/>
  <text x="740" y="1120" class="box-title" text-anchor="middle" style="font-size: 14px;">Executive Summary</text>
  <rect x="560" y="1140" width="360" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="740" y="1160" class="box-desc" text-anchor="middle" style="font-size: 10px;">Key findings overview</text>
  <text x="740" y="1180" class="box-desc" text-anchor="middle" style="font-size: 10px;">Organization risk assessment</text>
  <text x="740" y="1200" class="box-desc" text-anchor="middle" style="font-size: 10px;">Top 3 priority actions</text>

  <rect x="1000" y="1090" width="300" height="140" rx="10" class="ai-box" filter="url(#shadow)"/>
  <text x="1150" y="1120" class="box-title" text-anchor="middle" style="font-size: 14px;">Visualizations</text>
  <rect x="1020" y="1140" width="260" height="70" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="1150" y="1160" class="box-desc" text-anchor="middle" style="font-size: 10px;">5 matplotlib charts</text>
  <text x="1150" y="1180" class="box-desc" text-anchor="middle" style="font-size: 10px;">Pie, Bar, Stacked Bar</text>
  <text x="1150" y="1200" class="box-desc" text-anchor="middle" style="font-size: 10px;">Risk &amp; Compliance views</text>

  <!-- Arrow from risk to AI -->
  <path d="M 700 990 L 700 1090" class="arrow-main"/>

  <!-- ============ LAYER 6: OUTPUT ============ -->
  <text x="50" y="1290" class="section-label">LAYER 6: AGENT OUTPUTS</text>

  <!-- CSV Output -->
  <rect x="80" y="1320" width="400" height="150" rx="10" class="output-box" filter="url(#shadow)"/>
  <text x="280" y="1350" class="box-title" text-anchor="middle" style="font-size: 14px;">CSV Report</text>
  <text x="280" y="1375" class="box-desc" text-anchor="middle" style="font-size: 10px;">misaligned_hospitals_q1_2026.csv</text>
  <rect x="100" y="1395" width="360" height="60" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="280" y="1415" class="box-desc" text-anchor="middle" style="font-size: 9px;">hospital_id | hospital_name | quarterly_spend</text>
  <text x="280" y="1432" class="box-desc" text-anchor="middle" style="font-size: 9px;">alignment_status | risk_level | issues</text>

  <!-- Text Report -->
  <rect x="540" y="1320" width="400" height="150" rx="10" class="output-box" filter="url(#shadow)"/>
  <text x="740" y="1350" class="box-title" text-anchor="middle" style="font-size: 14px;">Text Report</text>
  <text x="740" y="1375" class="box-desc" text-anchor="middle" style="font-size: 10px;">analysis_report_q1_2026.txt</text>
  <rect x="560" y="1395" width="360" height="60" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="740" y="1415" class="box-desc" text-anchor="middle" style="font-size: 9px;">Summary statistics &amp; risk breakdown</text>
  <text x="740" y="1432" class="box-desc" text-anchor="middle" style="font-size: 9px;">Hospital details with AI recommendations</text>

  <!-- Visualization Output -->
  <rect x="1000" y="1320" width="300" height="150" rx="10" class="output-box" filter="url(#shadow)"/>
  <text x="1150" y="1350" class="box-title" text-anchor="middle" style="font-size: 14px;">Visualizations</text>
  <text x="1150" y="1375" class="box-desc" text-anchor="middle" style="font-size: 10px;">outputs/visualizations/*.png</text>
  <rect x="1020" y="1395" width="260" height="60" fill="rgba(255,255,255,0.15)" rx="6"/>
  <text x="1150" y="1415" class="box-desc" text-anchor="middle" style="font-size: 9px;">alignment_status_pie.png</text>
  <text x="1150" y="1432" class="box-desc" text-anchor="middle" style="font-size: 9px;">risk_level_distribution.png</text>

  <!-- Arrow from AI to outputs -->
  <path d="M 700 1230 L 700 1320" class="arrow-main"/>

  <!-- Data Flow Summary -->
  <text x="200" y="1540" class="small-text" font-weight="600">Data Flow Summary:</text>
  <text x="200" y="1565" class="small-text">1. S3 → Bedrock KB: Documents indexed with vector embeddings</text>
  <text x="200" y="1585" class="small-text">2. Bedrock KB: retrieve_and_generate for contracts/catalog, retrieve for raw PO data</text>
  <text x="200" y="1605" class="small-text">3. LangGraph Workflow: 5-step pipeline (Contract Rules → Product Catalog → PO Data → Analyze → AI Insights)</text>
  <text x="200" y="1625" class="small-text">4. Risk Engine: Detects off-contract purchases, tier violations, spend shortfalls</text>
  <text x="200" y="1645" class="small-text">5. Amazon Nova Pro: Generates per-hospital recommendations and executive summary</text>
  <text x="200" y="1665" class="small-text">6. Outputs: CSV report, text report with AI insights, 5 visualization charts</text>

  <!-- Version -->
  <text x="1300" y="1780" class="small-text" text-anchor="end">Version 0.2.0 | February 2026</text>

</svg>
