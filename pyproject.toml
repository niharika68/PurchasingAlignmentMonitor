[tool.poetry]
name = "purchasing-alignment-monitor"
version = "0.1.0"
description = "AI-powered healthcare purchasing alignment monitoring system using AWS Bedrock and LangGraph"
authors = ["Niharika68 <nihapat2@gmail.com>"]
readme = "README.md"
packages = [{include = "purchasing_alignment_monitor"}]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.34.0"
pydantic = "^2.5.0"
langgraph = "^0.1.0"
langchain = "^0.2.0"
langchain-core = "^0.2.0"
langchain-aws = "^0.1.0"
pandas = "^2.1.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.12.0"
ruff = "^0.1.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
